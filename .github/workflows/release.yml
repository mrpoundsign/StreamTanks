name: Release StreamTanks

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI & Font Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev fonts-dejavu-core

      - name: Run Full Test Suite
        run: go test -v ./...

      - name: Check Go Modernization
        run: |
          diff=$(go fix -diff ./...)
          if [ -n "$diff" ]; then
            echo "Go modernization diff found:"
            echo "$diff"
            exit 1
          fi

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Validate GoReleaser Config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  build-web:
    name: Build Web & Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle & Package Extension
        run: |
          npm run build:prod
          npm run package:ext

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension.zip

      - name: Upload Web Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web/public/

  build-gui-linux-windows:
    name: Build Desktop GUI (Linux & Windows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI & MinGW Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-mingw-w64 gcc libgl1-mesa-dev xorg-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxxf86vm-dev libwayland-dev libxkbcommon-dev fonts-dejavu-core

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.3

      - name: Compile Linux and Windows GUI
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p gui-dist
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ ! "$TAG" =~ ^v ]]; then
            TAG="snapshot"
          fi

          echo "Building Linux amd64 GUI package..."
          fyne package -os linux -app-id com.poundsigndesign.streamtanks.client -name StreamTanksGameClient -icon "$PWD/assets/icon.png" -src ./cmd/stclient
          LINUX_PKG=$(find . -name "StreamTanksGameClient.tar.xz" | head -n 1)
          test -n "$LINUX_PKG" || (echo "Linux package not found" && exit 1)
          mv "$LINUX_PKG" "gui-dist/StreamTanksGameClient_${TAG}_linux_amd64.tar.xz"

          echo "Cross-compiling Windows amd64 GUI binary..."
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 fyne package -os windows -app-id com.poundsigndesign.streamtanks.client -name StreamTanksGameClient -icon "$PWD/assets/icon.png" -src ./cmd/stclient
          WIN_EXE=$(find . -name "StreamTanksGameClient.exe" | head -n 1)
          test -n "$WIN_EXE" || (echo "Windows exe not found" && exit 1)
          mv "$WIN_EXE" "gui-dist/StreamTanksGameClient_${TAG}_windows_amd64.exe"

      - name: Upload GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist-linux-windows
          path: gui-dist/

  build-gui-macos:
    name: Build Desktop GUI (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.3

      - name: Build macOS GUI
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p gui-dist
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ ! "$TAG" =~ ^v ]]; then
            TAG="snapshot"
          fi

          fyne package -os darwin -app-id com.poundsigndesign.streamtanks.client -name StreamTanksGameClient -icon "$PWD/assets/icon.png" -src ./cmd/stclient
          zip -r "gui-dist/StreamTanksGameClient_${TAG}_darwin_all.zip" StreamTanksGameClient.app

      - name: Upload GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist-macos
          path: gui-dist/

  release:
    name: Release Binaries (GoReleaser + Client)
    needs: [test, build-web, build-gui-linux-windows, build-gui-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download Twitch Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: extension
          path: .

      - name: Ensure Extension Archive Placement
        run: |
          if [ -f extension/extension.zip ]; then
            mv extension/extension.zip ./extension.zip
          fi
          test -f extension.zip || (echo "extension.zip not found" && exit 1)

      - name: Download Web Assets Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web/public/

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --clean --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download GUI Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gui-dist-*
          path: gui-dist
          merge-multiple: true

      - name: Update and Consolidate Checksums
        run: |
          cd gui-dist
          sha256sum * >> ../dist/checksums.txt
          cd ..
          sort -k2 -o dist/checksums.txt dist/checksums.txt
          echo "=== Final Consolidated dist/checksums.txt ==="
          cat dist/checksums.txt

      - name: Attach GUI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} gui-dist/* dist/checksums.txt --clobber
