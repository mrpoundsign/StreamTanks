name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-test:
    name: Go Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Fyne Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libx11-dev

      - name: Run Go Test Suite
        run: go test -v ./...

      - name: Check Go Modernization
        run: |
          diff=$(go fix -diff ./...)
          if [ -n "$diff" ]; then
            echo "Go modernization diff found:"
            echo "$diff"
            exit 1
          fi

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Verify Binary Compilation
        run: go build -v ./cmd/streamtanks

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Vitest Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build:prod
