<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTanks - Twitch Artillery Overlay</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- 1920x1080 standard overlay size -->
        <canvas id="gameCanvas" width="1920" height="1080"></canvas>
        
        <!-- UI overlay elements over the canvas -->
        <div id="ui-layer">
            <div id="emotes-layer"></div>
            <div id="leaderboard">
                <h3>Top Commanders</h3>
                <ul id="leaderboard-list"></ul>
            </div>
            <!-- Top HUD: Phase Badge, Instructions, and Countdown Timer -->
            <div id="hud-top">
                <div id="phase-badge" class="hud-badge idle">WAITING</div>
                <div id="hud-instructions">Type <span class="cmd-highlight">%startgame</span> to start</div>
                <div id="timer-display" style="display: none;">20</div>
            </div>
            <div id="kill-feed"></div>
            
            <div id="celebration-display" style="display: none;">
                <img id="celebration-avatar" src="" style="display: none;">
                <h1 id="celebration-text">WINNER!</h1>
            </div>

            <!-- Config & Settings Modal (Centered Overlay) -->
            <div id="config-modal" style="display: none;">
                <div class="config-header">
                    <div class="config-title">COMMANDER CONFIGURATION</div>
                    <div class="config-subtitle">Live StreamTanks Settings &amp; Adjustment Commands</div>
                </div>
                <div class="config-table-container">
                    <table class="config-table">
                        <thead>
                            <tr>
                                <th>Setting</th>
                                <th>Current Value</th>
                                <th>Command Syntax</th>
                            </tr>
                        </thead>
                        <tbody id="config-table-body">
                            <!-- Populated dynamically by game.js -->
                        </tbody>
                    </table>
                </div>
                <div class="config-footer">
                    Type <span class="cmd-highlight" id="config-dismiss-hint">%config off</span> to dismiss
                </div>
            </div>
        </div>
    </div>
    
    <!-- Debug command bar (active only when debug mode is enabled, fixed to viewport) -->
    <div id="debug-bar" style="display: none;">
        <span class="debug-badge">DEBUG MODE</span>
        <input type="text" id="debug-input" placeholder="Type command (%startgame, %fire 45 60, %left, etc.)..." autocomplete="off" />
        <button id="debug-send-btn">Send</button>
    </div>

    <script src="game.js?v=5"></script>
</body>
</html>
