<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTanks - Twitch Artillery Overlay</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- 1920x1080 standard overlay size -->
        <canvas id="gameCanvas" width="1920" height="1080"></canvas>
        
        <!-- UI overlay elements over the canvas -->
        <div id="ui-layer">
            <div id="emotes-layer"></div>
            <div id="leaderboard">
                <h3>Top Commanders</h3>
                <ul id="leaderboard-list"></ul>
            </div>
            <div id="phase-display" style="display: none;"></div>
            <div id="timer-display"></div>
            <div id="kill-feed"></div>
            
            <div id="celebration-display" style="display: none;">
                <img id="celebration-avatar" src="" style="display: none;">
                <h1 id="celebration-text">WINNER!</h1>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
