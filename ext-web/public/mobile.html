<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTanks Mobile Extension</title>
    <!-- Twitch Extension Helper -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <link rel="stylesheet" href="ext.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="mobile-body">
    <div class="mobile-container">
        <!-- Header -->
        <header class="mobile-header">
            <div class="logo">STREAMTANKS</div>
            <span id="phase-badge" class="phase-badge idle">IDLE</span>
        </header>

        <!-- Mobile Landing Page Card (displayed when Twitch identity link is required) -->
        <div id="mobile-landing" class="mobile-landing-card hidden">
            <div class="landing-tag">INTERACTIVE BATTLEFIELD</div>
            <h2 class="landing-title">JOIN THE BATTLE</h2>
            <p class="landing-desc">
                Aim with the protractor, adjust power, and blast enemy tanks live on stream! Link your Twitch account to deploy your tank and track leaderboard stats.
            </p>
            <div class="landing-notice">
                <span class="notice-icon">🛡️</span>
                <span>Twitch identity link required to participate.</span>
            </div>
            <button id="btn-connect-twitch-mobile" class="btn primary glowing-cyan touch-target landing-btn">CONNECT TWITCH TO PLAY</button>
        </div>

        <!-- Queued Move/Action Feedback Badge -->
        <div id="current-action-badge" class="current-action-badge mobile-action-badge hidden"></div>

        <!-- Aiming Controls: Protractor & Vertical Power Gauge -->
        <div class="aiming-controls-row">
            <!-- Standalone Mobile SVG Protractor -->
            <div class="mobile-protractor-wrapper">
                <svg id="viewport-svg" viewBox="-5 15 330 160" class="mobile-protractor-svg">
                    <defs>
                        <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Protractor Outer & Inner Tracks (center: 160, 160, radius: 110) -->
                    <path d="M 50 160 A 110 110 0 0 1 270 160" class="protractor-track" />
                    <path d="M 70 160 A 90 90 0 0 1 250 160" class="protractor-inner-track" />

                    <!-- Major Ticks and Degree Labels -->
                    <!-- 0° (Right) -->
                    <line x1="250" y1="160" x2="275" y2="160" class="prot-tick" />
                    <text x="282" y="164" class="prot-label">0°</text>

                    <!-- 45° -->
                    <line x1="223.6" y1="96.4" x2="241.3" y2="78.7" class="prot-tick" />
                    <text x="246" y="70" class="prot-label">45°</text>

                    <!-- 90° (Top) -->
                    <line x1="160" y1="70" x2="160" y2="45" class="prot-tick" />
                    <text x="160" y="36" text-anchor="middle" class="prot-label">90°</text>

                    <!-- 135° -->
                    <line x1="96.4" y1="96.4" x2="78.7" y2="78.7" class="prot-tick" />
                    <text x="56" y="70" class="prot-label">135°</text>

                    <!-- 180° (Left) -->
                    <line x1="70" y1="160" x2="45" y2="160" class="prot-tick" />
                    <text x="38" y="164" text-anchor="end" class="prot-label">180°</text>

                    <!-- Minor Ticks (every 15°) -->
                    <!-- 15° -->
                    <line x1="256.2" y1="134.1" x2="265.8" y2="131.5" class="prot-tick" stroke-width="1" />
                    <!-- 30° -->
                    <line x1="245.2" y1="110.0" x2="253.9" y2="105.0" class="prot-tick" stroke-width="1" />
                    <!-- 60° -->
                    <line x1="210.0" y1="74.8" x2="215.0" y2="66.1" class="prot-tick" stroke-width="1" />
                    <!-- 75° -->
                    <line x1="185.9" y1="63.8" x2="188.5" y2="54.2" class="prot-tick" stroke-width="1" />
                    <!-- 105° -->
                    <line x1="134.1" y1="63.8" x2="131.5" y2="54.2" class="prot-tick" stroke-width="1" />
                    <!-- 120° -->
                    <line x1="110.0" y1="74.8" x2="105.0" y2="66.1" class="prot-tick" stroke-width="1" />
                    <!-- 150° -->
                    <line x1="74.8" y1="110.0" x2="66.1" y2="105.0" class="prot-tick" stroke-width="1" />
                    <!-- 165° -->
                    <line x1="63.8" y1="134.1" x2="54.2" y2="131.5" class="prot-tick" stroke-width="1" />

                    <!-- Interactive Aiming Needle (default 45°) -->
                    <line id="angle-needle" x1="160" y1="160" x2="237.8" y2="82.2" class="needle-line" filter="url(#cyan-glow)" />
                    <circle id="needle-head" cx="237.8" cy="82.2" r="7" class="needle-head" filter="url(#cyan-glow)" />
                    <circle id="pivot-center" cx="160" cy="160" r="8" class="pivot-center" filter="url(#cyan-glow)" />

                    <!-- Touch Hit Area (extended 50% inward: inner radius 55, outer radius 140) -->
                    <path id="protractor-hit-area" class="hit-area" d="M 20 160 A 140 140 0 0 1 300 160 L 215 160 A 55 55 0 0 0 105 160 Z" />
                </svg>

                <!-- Angle readout badge -->
                <div class="mobile-angle-badge">
                    <span id="val-angle" class="angle-display">45°</span>
                </div>
            </div>

            <!-- Vertical Power Gauge Column -->
            <div class="vertical-power-wrapper">
                <div class="power-header">
                    <span class="power-title">PWR</span>
                    <span id="val-power" class="power-display">100%</span>
                </div>
                <div id="vertical-power-track" class="vertical-power-track">
                    <div id="power-fill-bar" class="power-fill-bar" style="height: 100%;"></div>
                    <div id="power-thumb" class="power-thumb" style="bottom: 100%;"></div>
                </div>
                <input type="range" id="slider-power" min="1" max="100" value="100" class="hidden-accessible-range" />
            </div>
        </div>

        <!-- Mobile Controls Panel -->
        <div id="app" class="mobile-controls">
            <!-- Admin Controls -->
            <section id="admin-controls" class="hidden">
                <button id="btn-start-match" class="btn primary glowing-red touch-target">START MATCH</button>
            </section>

            <!-- Player Setup -->
            <section id="player-setup" class="hidden">
                <button id="btn-join" class="btn primary glowing-cyan touch-target">DEPLOY TANK</button>
            </section>

            <!-- Player Controls -->
            <section id="player-controls" class="hidden">
                <div class="move-row">
                    <button id="btn-left" class="btn secondary touch-target">&lt; MOVE L</button>
                    <button id="btn-right" class="btn secondary touch-target">MOVE R &gt;</button>
                </div>

                <button id="btn-fire" class="btn primary glowing-magenta touch-target">FIRE CANNON</button>
            </section>

            <!-- Feedback -->
            <div id="status-message" class="status-message hidden">CANNONS FIRING...</div>
            <div id="message-log"></div>
        </div>
    </div>

    <script src="ext.js"></script>
</body>
</html>
