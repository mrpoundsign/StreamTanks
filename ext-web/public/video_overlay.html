<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTanks Desktop Extension</title>
    <!-- Twitch Extension Helper -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <link rel="stylesheet" href="ext.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="desktop-body">
    <!-- SVG Viewport 1920x1080 directly scaling to match the viewer's stream video -->
    <svg id="viewport-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
        <defs>
            <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>

        <!-- Protractor Aiming Overlay (Centered at 250, 250 on 1920x1080 stream) -->
        <g id="protractor-overlay-group" class="protractor-group">
            <!-- Semi-circular click/drag hit area (inner radius 50, outer radius 210) -->
            <path id="protractor-hit-area" class="hit-area" d="M 40 250 A 210 210 0 0 1 460 250 L 400 250 A 150 150 0 0 0 100 250 Z" />

            <!-- Selected angle indicator needle line (default 45°) -->
            <line id="angle-needle" x1="250" y1="250" x2="363.1" y2="136.9" class="needle-line" filter="url(#cyan-glow)" />

            <!-- Needle endpoint marker -->
            <circle id="needle-head" cx="363.1" cy="136.9" r="7" class="needle-head" filter="url(#cyan-glow)" />

            <!-- Pivot center marker -->
            <circle cx="250" cy="250" r="9" class="pivot-center" filter="url(#cyan-glow)" />

            <!-- Angle readout badge positioned just below pivot -->
            <g id="angle-badge-group" transform="translate(250, 288)">
                <rect x="-42" y="-15" width="84" height="30" rx="6" class="badge-bg" />
                <text id="val-angle" x="0" y="5" text-anchor="middle" class="badge-text">45°</text>
            </g>
        </g>

        <!-- Tactical Controls situated directly underneath the protractor arc -->
        <foreignObject x="90" y="325" width="320" height="420">
            <div id="app" class="tactical-panel" xmlns="http://www.w3.org/1999/xhtml">
                <!-- Panel Header -->
                <div class="panel-header">
                    <span class="panel-title">FIRE CONTROL</span>
                    <span id="phase-badge" class="phase-badge idle">IDLE</span>
                </div>

                <!-- Admin Start Match (broadcaster / mod only) -->
                <section id="admin-controls" class="hidden">
                    <button id="btn-start-match" class="btn primary glowing-red">START MATCH</button>
                </section>

                <!-- Player Setup / Deploy -->
                <section id="player-setup" class="hidden">
                    <button id="btn-join" class="btn primary glowing-cyan">DEPLOY TANK</button>
                </section>

                <!-- Player Controls -->
                <section id="player-controls" class="hidden">
                    <!-- Power Slider -->
                    <div class="slider-group">
                        <div class="slider-label">
                            <span>POWER</span>
                            <span id="val-power">100%</span>
                        </div>
                        <input type="range" id="slider-power" min="1" max="100" value="100" class="styled-slider power-slider" />
                    </div>

                    <!-- Move buttons -->
                    <div class="move-row">
                        <button id="btn-left" class="btn secondary">&lt; MOVE L</button>
                        <button id="btn-right" class="btn secondary">MOVE R &gt;</button>
                    </div>

                    <!-- Fire Cannon Button -->
                    <button id="btn-fire" class="btn primary glowing-magenta">FIRE CANNON</button>
                </section>

                <!-- Status notification during simulation -->
                <div id="status-message" class="status-message hidden">CANNONS FIRING...</div>

                <!-- Real-time feedback toast -->
                <div id="message-log"></div>
            </div>
        </foreignObject>
    </svg>

    <script src="ext.js"></script>
</body>
</html>
