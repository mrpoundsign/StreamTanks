<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>StreamTanks — Commander Admin Console</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <!-- Top Navigation Header -->
        <header class="admin-header">
            <div class="header-left">
                <div class="header-logo">
                    <span class="logo-accent">STREAM</span>TANKS
                </div>
                <div class="header-subtitle">Commander Admin Console</div>
            </div>

            <div class="header-center">
                <div id="phase-badge" class="phase-badge idle">IDLE</div>
                <div id="connection-pill" class="connection-pill disconnected">
                    <span class="pill-dot"></span>
                    <span id="connection-text">Connecting...</span>
                </div>
            </div>

            <div class="header-right">
                <button id="btn-quick-start" class="btn btn-primary">
                    <span class="btn-icon">&#9654;</span> Start Game
                </button>
                <button id="btn-quick-bouncy" class="btn btn-secondary">
                    Bouncy Walls: <span id="bouncy-status-text">Off</span>
                </button>
                <a href="/" target="_blank" class="btn btn-outline">
                    Launch Overlay &#8599;
                </a>
            </div>
        </header>

        <!-- Main Dashboard Content Grid -->
        <main class="admin-grid">
            <!-- Left Column: Settings & Configuration -->
            <section class="card config-card">
                <div class="card-header">
                    <div class="card-title">
                        <span class="card-icon">&#9881;</span> Match Configuration
                    </div>
                    <span class="card-badge">LIVE SYNC</span>
                </div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cfg-prefix">Command Prefix</label>
                            <div class="input-with-action">
                                <input type="text" id="cfg-prefix" maxlength="5" placeholder="%" />
                                <button id="btn-apply-prefix" class="btn btn-small">Set</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="cfg-commandtime">Input Window (sec)</label>
                            <div class="input-with-action">
                                <input type="number" id="cfg-commandtime" min="5" max="120" placeholder="20" />
                                <button id="btn-apply-commandtime" class="btn btn-small">Set</button>
                            </div>
                        </div>

                        <div class="form-group span-2">
                            <label>Auto Round: <span id="autoround-current-val" class="highlight-val">Off</span></label>
                            <div class="autoround-container">
                                <div class="preset-buttons">
                                    <button type="button" class="btn btn-tiny btn-preset" data-ar="0">Off</button>
                                    <button type="button" class="btn btn-tiny btn-preset" data-ar="-1">Instant</button>
                                    <button type="button" class="btn btn-tiny btn-preset" data-ar="1">1m</button>
                                    <button type="button" class="btn btn-tiny btn-preset" data-ar="2">2m</button>
                                    <button type="button" class="btn btn-tiny btn-preset" data-ar="3">3m</button>
                                    <button type="button" class="btn btn-tiny btn-preset" data-ar="5">5m</button>
                                </div>
                                <div class="input-with-action">
                                    <input type="number" id="cfg-autoround-custom" min="1" max="60" placeholder="Custom minutes (1-60)" />
                                    <button id="btn-apply-autoround-custom" class="btn btn-small">Set Min</button>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="cfg-minplayers">Min Players</label>
                            <div class="input-with-action">
                                <input type="number" id="cfg-minplayers" min="2" max="20" placeholder="5" />
                                <button id="btn-apply-minplayers" class="btn btn-small">Set</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="cfg-botpoints">Kill Bot Points</label>
                            <div class="input-with-action">
                                <input type="number" id="cfg-botpoints" min="0" max="10" placeholder="1" />
                                <button id="btn-apply-botpoints" class="btn btn-small">Set</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="cfg-speed">Physics Speed</label>
                            <div class="input-with-action">
                                <select id="cfg-speed">
                                    <option value="0.25">0.25x (Slow Mo)</option>
                                    <option value="0.5">0.5x (Default)</option>
                                    <option value="0.75">0.75x</option>
                                    <option value="1.0">1.0x (Fast)</option>
                                    <option value="1.5">1.5x (Turbo)</option>
                                </select>
                                <button id="btn-apply-speed" class="btn btn-small">Set</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="cfg-startperm">Start Game Perm</label>
                            <div class="input-with-action">
                                <select id="cfg-startperm">
                                    <option value="broadcaster">Broadcaster</option>
                                    <option value="mod">Mods & Broadcaster</option>
                                    <option value="vip">VIPs, Mods, Broadcaster</option>
                                    <option value="sub">Subscribers+</option>
                                    <option value="all">Everyone</option>
                                </select>
                                <button id="btn-apply-startperm" class="btn btn-small">Set</button>
                            </div>
                        </div>

                        <div class="form-group span-2">
                            <label for="cfg-configperm">Config Perm</label>
                            <div class="input-with-action">
                                <select id="cfg-configperm">
                                    <option value="broadcaster">Broadcaster</option>
                                    <option value="mod">Mods & Broadcaster</option>
                                    <option value="vip">VIPs, Mods, Broadcaster</option>
                                    <option value="sub">Subscribers+</option>
                                    <option value="all">Everyone</option>
                                </select>
                                <button id="btn-apply-configperm" class="btn btn-small">Set</button>
                            </div>
                        </div>

                        <div class="form-group span-2">
                            <label>Terrain Bounds: <span id="terrain-range-val" class="highlight-val">20% — 75%</span></label>
                            <div class="range-dual">
                                <input type="range" id="cfg-terrain-min" min="10" max="80" value="20" />
                                <input type="range" id="cfg-terrain-max" min="20" max="90" value="75" />
                                <button id="btn-apply-terrain" class="btn btn-small">Apply Terrain</button>
                            </div>
                        </div>

                        <div class="form-group span-2 toggle-row">
                            <button id="btn-toggle-idle" class="btn btn-secondary">
                                Idle HUD: <span id="idle-status-text">On</span>
                            </button>
                            <button id="btn-toggle-botfill" class="btn btn-secondary">
                                Bot Fill: <span id="botfill-status-text">On</span>
                            </button>
                            <button id="btn-reset-terrain" class="btn btn-secondary">
                                Re-roll Terrain
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Center Column: Active Players in Round -->
            <section class="card players-card">
                <div class="card-header">
                    <div class="card-title">
                        <span class="card-icon">&#127919;</span> Active Players
                        <span id="player-count-badge" class="count-badge">0</span>
                    </div>
                    <div class="card-actions">
                        <button id="btn-quick-join" class="btn btn-small btn-outline">+ Join Bot</button>
                    </div>
                </div>
                <div class="card-body scrollable-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Player</th>
                                <th>Aim</th>
                                <th>Power</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="players-table-body">
                            <tr class="empty-row">
                                <td colspan="5">No active players. Waiting for match or %join commands.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Right Column: Persistent Leaderboard -->
            <section class="card leaderboard-card">
                <div class="card-header">
                    <div class="card-title">
                        <span class="card-icon">&#127942;</span> Stream Leaderboard
                    </div>
                    <div class="card-actions">
                        <button id="btn-clear-lb" class="btn btn-small btn-danger">Clear All</button>
                    </div>
                </div>
                <div class="card-body scrollable-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;">#</th>
                                <th>Commander</th>
                                <th style="width: 70px;">Wins</th>
                                <th style="width: 80px;">Manage</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-table-body">
                            <tr class="empty-row">
                                <td colspan="4">No scores recorded yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
